name: LFS182 Lab 3.2 keyless sign and verify

'on':
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: lfs182-lab32-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ghcr.io/dzeusking-dev/lfs182-sigstore-lab-20260904
      IMAGE: ghcr.io/dzeusking-dev/lfs182-sigstore-lab-20260904:${{ github.sha }}
      EXPECTED_IDENTITY: https://github.com/dzeusking-dev/lfs182-sigstore-lab-20260904/.github/workflows/lab32.yml@refs/heads/main
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out the educational source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to the repository-linked GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build the demonstration image
        run: >-
          docker build
          --file Containerfile
          --build-arg REVISION="$GITHUB_SHA"
          --tag "$IMAGE"
          .

      - name: Push and capture the immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee push.log
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The registry did not return a valid immutable digest."
            exit 1
          fi
          printf 'IMAGE=%s\nDIGEST=%s\nIMAGE_DIGEST=%s@%s\n' \
            "$IMAGE" "$digest" "$IMAGE_REPOSITORY" "$digest" | tee summary.txt
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_ENV"

      - name: Keyless sign the exact digest and capture the registry attachment
        shell: bash
        run: |
          set -euo pipefail
          cosign sign \
            --yes \
            --upload=true \
            --registry-referrers-mode=legacy \
            "$IMAGE_DIGEST"
          cosign download signature "$IMAGE_DIGEST" > cosign-signature.json
          jq -e 'length >= 1' cosign-signature.json > /dev/null

      - name: Verify the exact workflow identity, issuer, and transparency evidence
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            --output json \
            "$IMAGE_DIGEST" > cosign-verification.json
          jq -e 'length >= 1' cosign-verification.json > /dev/null
          printf 'POSITIVE_VERIFICATION=PASS\nEXPECTED_IDENTITY=%s\nEXPECTED_ISSUER=%s\n' \
            "$EXPECTED_IDENTITY" "$EXPECTED_ISSUER" | tee -a summary.txt

      - name: Prove a wrong workflow identity is rejected
        shell: bash
        run: |
          set -euo pipefail
          wrong_identity="https://github.com/dzeusking-dev/not-this-repository/.github/workflows/lab32.yml@refs/heads/main"
          set +e
          cosign verify \
            --certificate-identity "$wrong_identity" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$IMAGE_DIGEST" > negative-wrong-identity.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::Verification unexpectedly accepted the wrong workflow identity."
            exit 1
          fi
          printf 'NEGATIVE_WRONG_IDENTITY=PASS_EXPECTED_FAILURE\n' | tee -a summary.txt

      - name: Prove an intentionally altered digest is rejected
        shell: bash
        run: |
          set -euo pipefail
          last="${DIGEST: -1}"
          replacement=0
          if [[ "$last" == 0 ]]; then replacement=1; fi
          altered_digest="${DIGEST::-1}${replacement}"
          set +e
          cosign verify \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$IMAGE_REPOSITORY@$altered_digest" > negative-altered-digest.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::Verification unexpectedly accepted the altered digest."
            exit 1
          fi
          printf 'NEGATIVE_ALTERED_DIGEST=PASS_EXPECTED_FAILURE\nALTERED_DIGEST=%s\n' \
            "$altered_digest" | tee -a summary.txt

      - name: Preserve non-sensitive lab evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lfs182-cosign-evidence-${{ github.sha }}
          path: |
            summary.txt
            push.log
            cosign-signature.json
            cosign-verification.json
            negative-wrong-identity.log
            negative-altered-digest.log
          if-no-files-found: warn
          retention-days: 7
